name: Fetch and prepare quality assets
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fetch-quality-assets.yml'
      - 'scripts/quality-assets-request.txt'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Blender Python module
        run: python -m pip install --disable-pip-version-check bpy==4.2.23 numpy pillow
      - name: Retrieve and prepare CC0 assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transport/quality
          python scripts/prepare_quality_assets.py transport/quality 2>&1 | tee transport/quality/fetch.log
      - name: Push prepared assets
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f transport/quality
          if ! git diff --cached --quiet; then
            git commit -m "ci: prepare quality CC0 trees rocks textures and HDRIs"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
