name: Fetch Blender OS libraries

# The Agent sandbox can reach github.com / pypi.org only, not Debian mirrors.
# This job runs in a debian:bookworm container (same OS/glibc as the sandbox),
# downloads the official .deb packages Blender's PyPI `bpy` module needs,
# records SHA-256 provenance, and pushes them to the branch it ran from so the
# sandbox can `git pull` them. The sandbox extracts them into vendor/runtime
# (gitignored) and removes vendor/debs from tracking again.
# On failure it pushes the captured log back to the branch for diagnosis,
# because the sandbox cannot download Actions log archives (blocked host).

on:
  workflow_dispatch:
  # workflow_dispatch requires the file on the default branch; the push trigger
  # lets session branches run it. Re-run by touching scripts/os-libs-request.txt.
  # Pushes made with GITHUB_TOKEN do not re-trigger workflows (no loop).
  push:
    paths:
      - '.github/workflows/fetch-os-libs.yml'
      - 'scripts/os-libs-request.txt'

permissions:
  contents: write

jobs:
  fetch-libs:
    runs-on: ubuntu-latest
    container: debian:bookworm
    defaults:
      run:
        shell: bash
    steps:
      - name: Install tooling
        run: |
          set -eo pipefail
          exec > >(tee -a /tmp/ci.log) 2>&1
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
          rm -f /etc/apt/apt.conf.d/docker-clean

      - name: Clone branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          exec > >(tee -a /tmp/ci.log) 2>&1
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Download official Debian packages
        run: |
          set -eo pipefail
          exec > >(tee -a /tmp/ci.log) 2>&1
          mkdir -p repo/vendor/debs
          # X/GL libraries required by bpy 4.2.x plus the software-GL (llvmpipe)
          # stack so OpenGL/Eevee can also work headless without a GPU.
          apt-get install --download-only --no-install-recommends -y \
            libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 \
            libsm6 libice6 libgl1 libglx-mesa0 libgl1-mesa-dri \
            libegl1 libegl-mesa0
          cp /var/cache/apt/archives/*.deb repo/vendor/debs/
          ls -la repo/vendor/debs/

      - name: Checksums and provenance
        run: |
          set -eo pipefail
          exec > >(tee -a /tmp/ci.log) 2>&1
          cd repo/vendor/debs
          sha256sum ./*.deb > SHA256SUMS
          {
            echo "source: official Debian bookworm mirrors via apt-get (debian:bookworm container)"
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "debian_version: $(cat /etc/debian_version)"
            echo "glibc: $(ldd --version | head -1)"
            echo
            for d in ./*.deb; do
              echo "== $d"
              dpkg-deb -f "$d" Package Version Architecture
              echo
            done
          } > PROVENANCE.txt

      - name: Commit and push packages
        run: |
          set -eo pipefail
          exec > >(tee -a /tmp/ci.log) 2>&1
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f vendor/debs
          git commit -m "ci: fetch Debian bookworm X/GL .debs for bpy (temporary transport)"
          git push origin HEAD:"$GITHUB_REF_NAME"

      - name: Push failure log for sandbox diagnosis
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          command -v git >/dev/null || { echo "git missing; cannot report"; exit 0; }
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" failrepo || exit 0
          mkdir -p failrepo/vendor
          cp /tmp/ci.log failrepo/vendor/ci-failure.log || true
          cd failrepo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f vendor/ci-failure.log
          git commit -m "ci: failure log for OS-library fetch" || exit 0
          git push origin HEAD:"$GITHUB_REF_NAME" || true
