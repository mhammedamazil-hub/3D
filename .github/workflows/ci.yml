name: voxelcore-ci
on:
  push:
    branches: [arena/3e3c4ae6-3d, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          python3 -m pip install --break-system-packages cmake ninja || python3 -m pip install cmake ninja
      - name: Configure
        run: cmake -S voxelcore -B voxelcore/build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: ninja -C voxelcore/build
      - name: Unit tests
        run: ./voxelcore/build/voxelcore_tests
      - name: Benchmarks (smoke)
        run: ./voxelcore/build/voxelcore_bench
      - name: Headless render smoke test
        run: ./voxelcore/build/voxelcore render /tmp/voxelcore_ci.ppm 1234 1 320

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: python3 -m pip install cmake ninja
      - name: Configure ASan+UBSan
        run: cmake -S voxelcore -B voxelcore/build-san -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - name: Build
        run: ninja -C voxelcore/build-san
      - name: Unit tests under sanitizers
        run: ASAN_OPTIONS=detect_leaks=1 ./voxelcore/build-san/voxelcore_tests

  android-arm64-build:
    # Compile-only check for Android (arm64-v8a) with the NDK preinstalled on GitHub runners.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Android (arm64-v8a)
        run: |
          cmake -S voxelcore -B voxelcore/build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build Android libraries/executables
        run: ninja -C voxelcore/build-android

  vulkan-headless:
    # Renders a real frame through the Lavapipe CPU Vulkan driver (mesa-vulkan-drivers)
    # and validates the PPM output. Runs the same code path a discrete/integrated GPU would.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools + Vulkan stack
        run: |
          python3 -m pip install --break-system-packages cmake ninja || python3 -m pip install cmake ninja
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers glslang-tools vulkan-tools
      - name: Show Vulkan driver
        run: vulkaninfo --summary || true
      - name: Configure
        run: cmake -S voxelcore -B voxelcore/build-vk -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: ninja -C voxelcore/build-vk
      - name: Headless Vulkan render
        run: |
          set +e
          ./voxelcore/build-vk/vulkan_render /tmp/voxelcore_vulkan.ppm
          rc=$?
          set -e
          echo "vulkan_render exit code: $rc"
          if [ "$rc" = "0" ]; then
            python3 - << 'PYEOF'
            import sys
            data = open('/tmp/voxelcore_vulkan.ppm','rb').read()
            header, _, body = data.partition(b'255\n')
            parts = header.split()
            w, h = int(parts[1]), int(parts[2])
            assert len(body) == w*h*3, f'PPM body {len(body)} != {w*h*3}'
            non_sky = sum(1 for i in range(0, len(body), 3) if body[i:i+3] != bytes([89,140,213]))
            print(f'PPM OK: {w}x{h}, bytes={len(body)}, non-sky-pixel-count={non_sky}')
            assert non_sky > 1000, 'frame appears empty (all sky)'
            PYEOF
          elif [ "$rc" = "77" ]; then
            echo "::warning::vulkan_render skipped — no Vulkan device on this runner"
          else
            echo "vulkan_render FAILED with exit $rc" >&2
            exit "$rc"
          fi
