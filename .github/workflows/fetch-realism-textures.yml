name: Fetch CC0 PBR texture maps
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fetch-realism-textures.yml'
      - 'scripts/realism-textures-request.txt'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p transport/realism3
          python3 scripts/fetch_realism_textures.py transport/realism3 2>&1 | tee transport/realism3/fetch.log
      - if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f transport/realism3
          if ! git diff --cached --quiet; then
            git commit -m "ci: transport CC0 PBR texture maps"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
